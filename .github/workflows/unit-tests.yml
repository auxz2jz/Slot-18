name: Core tests
on:
  push:
    paths:
      - 'prototype/**'
      - '.github/workflows/unit-tests.yml'
  pull_request:
    paths:
      - 'prototype/**'
      - '.github/workflows/unit-tests.yml'
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check prototype/core.js
          node --check prototype/app.js
      - name: Unit tests
        run: node --test prototype/test_core.cjs
